name: Publish Scheduled Instagram Posts

on:
  schedule:
    - cron: "*/15 * * * *" # 15分ごとにschedule.txtの予定時刻をチェック
  workflow_dispatch: {}

jobs:
  publish_scheduled:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Publish scheduled posts
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/publish_scheduled.py

      - name: Commit archived posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A queue published
          git diff --cached --quiet || git commit -m "chore: archive scheduled posts"
          git push
