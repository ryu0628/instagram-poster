name: Collect Instagram Insights

on:
  schedule:
    - cron: "0 21 * * *" # 毎日 06:00 JST (UTC+9) に実行
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Collect insights
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/collect_insights.py

      - name: Commit insights data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/insights
          git diff --cached --quiet || git commit -m "chore: update insights data"
          git push
