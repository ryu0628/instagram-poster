name: Publish Instagram Post

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "queue/ 配下の投稿フォルダ名"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Publish to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/post_to_instagram.py "${{ inputs.post_id }}"

      - name: Archive published post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p published
          git mv "queue/${{ inputs.post_id }}" "published/${{ inputs.post_id }}"
          git commit -m "chore: archive published post ${{ inputs.post_id }}"
          git push
